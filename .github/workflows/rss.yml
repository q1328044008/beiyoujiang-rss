name: 更新 RSS 订阅源

on:
  schedule:
    # 每 30 分钟跑一次（GitHub 免费额度下可能有几分钟延迟）
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_feed.py"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: beiyoujiang-rss
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 feed（富文本 + 纯文本两版）
        run: |
          python generate_feed.py \
            --out docs/feed.xml \
            --text-out docs/feed-text.xml \
            --pages 2 \
            --page-size 20 \
            --limit 40 \
            --feed-url "https://q1328044008.github.io/beiyoujiang-rss/feed.xml"

      - name: 校验 XML 合法性
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('docs/feed.xml'); print('feed.xml OK')"
          python -c "import xml.etree.ElementTree as ET; ET.parse('docs/feed-text.xml'); print('feed-text.xml OK')"

      - name: 内容有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/feed.xml docs/feed-text.xml; then
            echo "内容无变化，跳过提交"
          else
            git add docs/feed.xml docs/feed-text.xml
            git commit -m "chore: 更新 feed $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
